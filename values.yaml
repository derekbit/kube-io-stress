# Same workload-size names/meanings as harvester-csi-stress CLI options:
parallel: 12             # Concurrent Pod workers
iterations: 100          # Sequential write + verify rounds per worker
dataVolumeCount: 1       # Independent data PVCs per worker
dataVolumeSizeGiB: 200   # Capacity of each PVC (200Gi)
dataSizeGiB: 30          # Random data written per PVC per iteration (30GiB)

namePrefix: io-stress
storageClass: longhorn-v2-replicated  # Existing StorageClass with dataEngine: "v2"
image: alpine:3.22

write:
  workers: 1             # Reference uses one buffered dd per data disk

# Match the reference README example (--memory 4Gi), not an upstream default.
# 12 Pods request 48Gi total, in addition to Longhorn and other node workloads.
resources:
  requests:
    cpu: 500m
    memory: 4Gi
  limits:
    memory: 4Gi
